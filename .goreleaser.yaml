# GoReleaser configuration for Trajan
# https://goreleaser.com
version: 2

project_name: trajan

before:
  hooks:
    - go mod tidy

builds:
  - id: trajan
    main: ./cmd/trajan
    binary: trajan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.Commit}}
      - -X main.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: praetorian-inc
    name: trajan
  draft: false
  prerelease: auto
  name_template: "Trajan v{{.Version}}"
  # Ship the machine-readable CLI surface as its own release asset, alongside the
  # archives, so a downstream consumer can pin against a published surface rather
  # than re-deriving it from a checkout. It is the same file the CLI Surface Drift
  # workflow proves is in sync with the live cobra tree on every pull request.
  #
  # `glob` is the only key `release.extra_files` entries accept besides
  # `name_template` (goreleaser v2 schema, $defs.ExtraFile). A glob that matches
  # nothing is a hard release failure, which is the behaviour wanted here: the
  # artifact is committed and un-ignored in .gitignore, so a missing file means
  # the gate's goldens were deleted rather than that the asset is optional.
  extra_files:
    - glob: ./docs/cli-surface.json
