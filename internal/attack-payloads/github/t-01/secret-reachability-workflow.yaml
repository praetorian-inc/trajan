id: t-01/secret-reachability-workflow
summary: Record that each named secret was reachable from this job's Actions context, without ever revealing a value.
flavor: workflow_steps

params:
  - { name: marker, type: string, required: true, doc: "the run-unique high-entropy token the harvest correlates on" }
  - { name: secret_names, type: "[]string", required: true, doc: "the exact names to assert on, from secrets.names or the target workflow's secrets_referenced facts; 'every enumerated secret' is not an accepted input" }
  - { name: assertion, type: string, default: presence, doc: "presence | length | digest — which non-secret derivative to emit; presence is sufficient for almost every finding" }
  - { name: digest_salt, type: string, doc: "chain-scoped HMAC key, required when assertion=digest so a digest is neither rainbow-tableable nor comparable across engagements" }
  - { name: scope_label, type: string, doc: "free text recording which scope the names came from (repo/org/environment), carried into the finding" }

# Emits one line per name: trajan-secret=<name> trajan-reachable=<bool>
# [trajan-length=<int>|trajan-digest=<16 hex>]. A name that resolves to nothing
# binds an empty variable and is reported unreachable — a meaningful negative,
# emitted rather than skipped. GitHub masks values by value, so a derivative that
# collides with a registered secret arrives as *** and is inconclusive, not absent.
#
# Each name is bound to its own step-level variable rather than interpolated into
# the command text: inline interpolation is the injection pattern the scanner
# itself flags. Values only ever reach shell variables and the printf builtin, so
# no secret lands in an argv a process listing on a shared runner could read.
body: |
  - name: trajan secret reachability
    shell: bash
    env:
      TRJ_SALT: << .Params.digest_salt >>
      <<- range $i, $n := .Params.secret_names >>
      TRJ_NAME_<< $i >>: << $n >>
      TRJ_VAL_<< $i >>: ${{ secrets.<< $n >> }}
      <<- end >>
    run: |
      marker=<< .Params.marker >>
      assertion=<< .Params.assertion >>
      scope=<< .Params.scope_label >>
      echo "trajan-marker=$marker"
      echo "trajan-assertion=$assertion trajan-scope=$scope"
      <<- if not .Params.secret_names >>
      echo trajan-error=secret-names-empty
      exit 1
      <<- end >>
      if [ "$assertion" = digest ]; then
        [ -n "${TRJ_SALT:-}" ] || { echo trajan-error=digest-salt-required; exit 1; }
        command -v openssl >/dev/null 2>&1 || { echo trajan-error=openssl-unavailable; exit 1; }
      fi
      assert() {
        name=$1
        val=${2:-}
        if [ -z "$val" ]; then
          echo "trajan-secret=$name trajan-reachable=false"
          return
        fi
        case $assertion in
          presence)
            echo "trajan-secret=$name trajan-reachable=true" ;;
          length)
            echo "trajan-secret=$name trajan-reachable=true trajan-length=${#val}" ;;
          digest)
            d=$(printf %s "$val" | openssl dgst -sha256 -hmac "$TRJ_SALT" -r | cut -c1-16)
            echo "trajan-secret=$name trajan-reachable=true trajan-digest=$d" ;;
          *)
            echo "trajan-error=unknown-assertion trajan-assertion=$assertion"
            exit 1 ;;
        esac
      }
      <<- range $i, $_ := .Params.secret_names >>
      assert "$TRJ_NAME_<< $i >>" "${TRJ_VAL_<< $i >>-}"
      <<- end >>
      echo "trajan-marker-end=$marker"
