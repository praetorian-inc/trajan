id: t-01/secret-reachability-shell
summary: Record which of a named list of secrets the consuming workflow had already mapped into the process environment this checked-out code runs in.
flavor: shell

params:
  - { name: marker, type: string, required: true, doc: "the run-unique high-entropy token the harvest correlates on" }
  - { name: secret_names, type: "[]string", required: true, doc: "the exact names to look for in the process environment; 'every enumerated secret' is not an accepted input" }
  - { name: assertion, type: string, default: presence, doc: "presence | length | digest — which non-secret derivative to emit; presence is sufficient for almost every finding" }
  - { name: digest_salt, type: string, doc: "chain-scoped HMAC key, required when assertion=digest so a digest is neither rainbow-tableable nor comparable across engagements" }
  - { name: scope_label, type: string, doc: "free text recording which scope the names came from (repo/org/environment), carried into the finding" }

# The shell counterpart of t-01/secret-reachability-workflow, and NOT equivalent
# to it: ${{ secrets.X }} is evaluated only inside workflow YAML, so a checked-out
# file reaches only what the consuming workflow already mapped into the process
# environment. That is an opportunistic set, not an enumerable one, which is why
# the negative is reported as trajan-env-mapped=false — "the target's workflow did
# not map this name into the job", never "the secret does not exist".
#
# Emits one line per name: trajan-secret=<name> trajan-env-mapped=<bool>
# [trajan-length=<int>|trajan-digest=<16 hex>]. Values only ever reach shell
# variables and the printf builtin, never an argv, never a file, never the network.
body: |
  #!/usr/bin/env bash
  set -u

  marker=<< .Params.marker >>
  assertion=<< .Params.assertion >>
  salt=<< .Params.digest_salt >>
  scope=<< .Params.scope_label >>

  echo "trajan-marker=$marker"
  echo "trajan-assertion=$assertion trajan-scope=$scope trajan-reachability-kind=opportunistic-process-env"

  <<- if not .Params.secret_names >>
  echo trajan-error=secret-names-empty
  exit 1
  <<- end >>

  if [ "$assertion" = digest ]; then
    [ -n "$salt" ] || { echo trajan-error=digest-salt-required; exit 1; }
    command -v openssl >/dev/null 2>&1 || { echo trajan-error=openssl-unavailable; exit 1; }
  fi

  for name in << .Params.secret_names >>; do
    case $name in
      ''|[0-9]*|*[!A-Za-z0-9_]*)
        echo "trajan-error=not-an-environment-variable-name trajan-secret=$name"
        continue ;;
    esac
    val=${!name-}
    if [ -z "$val" ]; then
      echo "trajan-secret=$name trajan-env-mapped=false"
      continue
    fi
    case $assertion in
      presence)
        echo "trajan-secret=$name trajan-env-mapped=true" ;;
      length)
        echo "trajan-secret=$name trajan-env-mapped=true trajan-length=${#val}" ;;
      digest)
        d=$(printf %s "$val" | openssl dgst -sha256 -hmac "$salt" -r | cut -c1-16)
        echo "trajan-secret=$name trajan-env-mapped=true trajan-digest=$d" ;;
      *)
        echo "trajan-error=unknown-assertion trajan-assertion=$assertion"
        exit 1 ;;
    esac
  done

  echo "trajan-marker-end=$marker"
