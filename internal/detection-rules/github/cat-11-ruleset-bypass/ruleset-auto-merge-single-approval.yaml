id: cat-11/ruleset-auto-merge-single-approval
scenario_id: cat-11/07
title: "Single approval suffices and no required status checks gate the merge"
subject: chain
graph: node(Branch)
severity: high
confidence: medium
description: >
  An active ruleset on this branch requires only one approving review and no
  status checks gate the merge. Combined with auto-merge, a single compromised or
  inattentive reviewer green-lights an immediate merge.
  The single_approval_required gap aggregates approval counts across active
  rulesets AND legacy branch protection as the MAX (strictest), so it means no
  control requires more than one approval — one approval is truly sufficient.
  no_status_checks likewise accounts for legacy required status checks.
  NOTE: joins the effective-ruleset chain (produced by correlate during
  normalize); the auto-merge repo setting itself is not yet collected, so this
  ports the approval + status-check portion only.

chain_of:
  join: effective-ruleset
  for_each: effective_per_branch
  where:
    all_of:
      - active_ruleset_count >= 1
      - requires_pull_request_active == true
      - gaps ∋ single_approval_required
      - gaps ∋ no_status_checks

evidence:
  - "Repo {{ repo }} branch `{{ branch }}`: 1 approval suffices and no required status checks gate the merge."

remediation_hint: >
  Require >=2 approving reviews on this branch, OR require status checks that
  cannot be self-issued.
