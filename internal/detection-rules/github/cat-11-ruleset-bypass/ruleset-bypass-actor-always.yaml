id: cat-11/ruleset-bypass-actor-always
scenario_id: cat-11/01
title: "Active ruleset covering branch has bypass actors"
subject: chain
graph: node(Branch)
severity: high
confidence: high
description: >
  At least one active ruleset covering this branch includes bypass actors — repo
  admins, GitHub Apps, or specific teams skip every rule that ruleset declares.
  NOTE: joins the effective-ruleset chain (produced by correlate during
  normalize). any_bypass_present_in_active does not distinguish bypass_mode
  always from pull_request, so a pull_request-only bypass also fires here; the
  always/pull_request split lives in rulesets_by_id, which the path DSL cannot
  project over because it is keyed by ruleset id.

chain_of:
  join: effective-ruleset
  for_each: effective_per_branch
  where:
    all_of:
      - active_ruleset_count >= 1
      - any_bypass_present_in_active == true

evidence:
  - "Repo {{ repo }} branch `{{ branch }}` has active rulesets with bypass actors."

remediation_hint: >
  Remove bypass_mode: always from production rulesets; restrict bypass to
  pull_request mode only so bypassing actors must still submit a PR.
